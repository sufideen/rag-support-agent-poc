name: Deploy infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main-rag-poc.bicep \
            --parameters \
              existingKeyVaultName="${{ vars.KEY_VAULT_NAME }}" \
              existingLogAnalyticsName="${{ vars.LOG_ANALYTICS_NAME }}" \
              existingPrivateEndpointSubnetId="${{ vars.PRIVATE_ENDPOINT_SUBNET_ID }}" \
              dataPlaneAccessPrincipalId="${{ vars.DATA_PLANE_PRINCIPAL_ID }}" \
              dataPlaneAccessPrincipalType="ServicePrincipal"

  deploy:
    needs: what-if
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main-rag-poc.bicep \
            --parameters \
              existingKeyVaultName="${{ vars.KEY_VAULT_NAME }}" \
              existingLogAnalyticsName="${{ vars.LOG_ANALYTICS_NAME }}" \
              existingPrivateEndpointSubnetId="${{ vars.PRIVATE_ENDPOINT_SUBNET_ID }}" \
              dataPlaneAccessPrincipalId="${{ vars.DATA_PLANE_PRINCIPAL_ID }}" \
              dataPlaneAccessPrincipalType="ServicePrincipal"
